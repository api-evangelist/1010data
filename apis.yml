apis:
- name: 1010data XML API
  description: >-
    The 1010data XML API is an HTTP/XML facility whereby a client application can
    access and query data on the 1010data Insights Platform database servers.
    It is compatible with any language that supports HTTP transactions (Java,
    C++, Python, PERL, Visual Basic) and drives the platform's Macro Language
    query engine.
  humanURL: https://docs.1010data.com/XMLAPI/index.html
  baseURL: https://www2.1010data.com
  properties:
  - type: APIReference
    url: https://docs.1010data.com/XMLAPI/index.html
  - type: Documentation
    url: https://docs.1010data.com/XMLAPI/Introduction/XMLAPI-Intro.html
- name: 1010data Dynamic API
  description: >-
    The 1010data Dynamic API is a RESTful HTTP interface for writing client
    applications that access and query data on the Insights Platform. It uses
    session-based authentication and stateful QuickApp "environments" (tags),
    with endpoints such as /api/!login and /api/new.
  humanURL: https://docs.1010data.com/DynamicAPI/index.html
  baseURL: https://www2.1010data.com
