aid: 1010data
name: 1010data
description: >-
  1010data is an enterprise big-data analytics and data-management company whose
  Insights Platform combines a cloud-based columnar analytics engine (the
  "Trillion-Row Spreadsheet"), a data-sharing marketplace, and a suite of
  developer interfaces for querying and integrating large datasets. It serves
  retail, consumer brands, capital markets, and other data-intensive industries.
  Developers access the platform through the HTTP/XML API, the RESTful Dynamic
  API, and first-party SDKs for Python (py1010 / TenFrame), Java, .NET, and R,
  plus JDBC/ODBC drivers, an Excel add-in, and Power BI and Tableau connectors.
  1010data was acquired by Advance (Advance/Newhouse) for $500 million in 2015 and
  continues to operate the Insights Platform. This profile was enriched by the
  API Evangelist pipeline from the company's public documentation center.
