  operations against it. These are documented in the 1010data Documentation
  Center alongside the SDKs.
install:
- Download the DataBlazer command-line tools from the 1010data Documentation Center / downloads.
commands:
- name: TenUp
  description: Command-line tool for uploading data to the 1010data Insights Platform.
- name: TenDo
  description: Command-line tool for executing 1010data operations/queries from the command line.
